# BreakCart web: serves the built SPA and reverse-proxies the two backends.
#
#   /api/      -> gateway:3000/api/            (storefront API, keeps the /api prefix)
#   /control/  -> control-plane:3010/control/  (war room API + SSE stream)
#
# Containers come and go during the labs (kill-service, OOM, restarts), so upstream
# names are resolved at runtime through Docker's embedded DNS: nginx starts even if
# the backends are not up yet, and follows them when they come back with a new IP.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    server_tokens      off;
    client_max_body_size 1m;

    # Compress text responses. text/event-stream is deliberately NOT listed:
    # gzip buffers output and would hold SSE events back.
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_types         text/plain text/css text/xml application/json application/javascript
                       application/xml image/svg+xml;

    # Docker's embedded DNS; re-resolve every 10s.
    resolver          127.0.0.11 valid=10s ipv6=off;
    resolver_timeout  5s;

    # Pooled keep-alive connections to the backends. `resolve` (nginx >= 1.27.3) defers
    # DNS to runtime, so a missing container does not stop nginx from starting.
    upstream gateway_backend {
        zone gateway_backend 64k;
        server gateway:3000 resolve;
        keepalive 64;
        keepalive_timeout 60s;
    }

    upstream control_backend {
        zone control_backend 64k;
        server control-plane:3010 resolve;
        keepalive 16;
        keepalive_timeout 60s;
    }

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;
        absolute_redirect off;

        # proxy_pass through variables: evaluated per request (never at startup); the
        # values name the upstream groups above, so keep-alive pooling still applies.
        set $gateway_upstream  gateway_backend;
        set $control_upstream  control_backend;

        # ------------------------------------------------------------ storefront API
        location /api/ {
            proxy_pass http://$gateway_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            # Long enough to *feel* a 30s blocking dependency instead of masking it.
            proxy_read_timeout    120s;
            # Never replay checkout / pay on our own; retries are the app's decision.
            proxy_next_upstream   off;

            # Only errors nginx itself generates (backend unreachable / timed out) land
            # here; the gateway's own 502/503/504 JSON bodies pass through untouched.
            error_page 502 503 = @gateway_unavailable;
            error_page 504     = @gateway_timeout;
        }

        location @gateway_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The gateway is unreachable from the web proxy","retryable":true}}';
        }

        location @gateway_timeout {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 504 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The gateway did not answer in time (web proxy timeout)","retryable":true}}';
        }

        # ------------------------------------------------------------ control plane (+ SSE)
        location /control/ {
            proxy_pass http://$control_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Server-sent events (/control/events): forward every event immediately and
            # keep the stream open.
            proxy_buffering       off;
            proxy_cache           off;
            proxy_connect_timeout 5s;
            proxy_send_timeout    1h;
            proxy_read_timeout    1h;
            proxy_next_upstream   off;

            error_page 502 503 = @control_unavailable;
            error_page 504     = @control_timeout;
        }

        location @control_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The control plane is unreachable from the web proxy","retryable":true}}';
        }

        location @control_timeout {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 504 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The control plane did not answer in time","retryable":true}}';
        }

        # ------------------------------------------------------------ static files
        # Vite emits content-hashed file names under /assets/: cache them forever.
        location /assets/ {
            try_files $uri =404;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SPA: every other path renders index.html (client-side routing). Never cache
        # the HTML shell, so a new deploy is picked up on the next load.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
